name = "crawler-books"
main = "src/worker.js"
compatibility_date = "2025-12-01"

[[d1_databases]]
binding = "DB"
database_name = "crawler"
database_id = "REPLACE_ME"

[[queues.producers]]
binding = "CRAWL_QUEUE"
queue = "crawl_queue"

[[queues.producers]]
binding = "RANK_QUEUE"
queue = "rank_queue"

[[queues.consumers]]
queue = "crawl_queue"
max_batch_size = 5
max_batch_timeout = 30

[[queues.consumers]]
queue = "rank_queue"
max_batch_size = 1
max_batch_timeout = 30

[triggers]
crons = ["*/15 * * * *", "*/30 * * * *"]

[[rules]]
type = "Text"
globs = ["**/*.txt"]
